spring:
  application:
    name: reservasbackend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:192.168.80.27}:${POSTGRES_PORT:5432}/${POSTGRES_DB:reservas_db}
    username: ${APP_DB_USER:app_reservas}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ReservasHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-test-query: SELECT 1

  mongodb:
    uri: ${MONGO_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:reservas_eventos_docs}?connectTimeoutMS=3000&serverSelectionTimeoutMS=3000}
    database: ${MONGO_DB:reservas_eventos_docs}

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:reservas_eventos_docs}?connectTimeoutMS=3000&serverSelectionTimeoutMS=3000}
      database: ${MONGO_DB:reservas_eventos_docs}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    user: ${POSTGRES_USER:reservas_admin}
    password: ${POSTGRES_PASSWORD:}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

app:
  security:
    staff-access-key: ${STAFF_ACCESS_KEY:}
